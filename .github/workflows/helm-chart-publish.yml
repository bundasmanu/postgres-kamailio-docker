---

name: Helm Chart Publish GHCR

on:
    push:
        branches:
            - '**'
        tags:
            - '**'
    pull_request:
        branches:
            - main

permissions:
    contents: read ## let's allow the workflow to read the repository contents
    packages: write ## let's allow the workflow to publish and modify packages (required for ghcr.io)

jobs:
  helm-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          helm package ./helm/kamailio-db

      - name: Get chart version
        id: vars
        run: |
          VERSION=$(yq e '.version' ./helm/kamailio-db/Chart.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to OCI
        run: helm push kamailio-db-${{ steps.vars.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
