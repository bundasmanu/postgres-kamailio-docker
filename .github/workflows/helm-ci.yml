---

name: Helm Chart Install Test

on:
    push:
        branches:
            - '**'
        tags:
            - '**'
    pull_request:
        branches:
            - main

jobs:
  helm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Create k3d cluster
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create test --wait

      - name: Create namespace
        run: |
          kubectl create ns kamailio-db

      - name: Lint chart
        run: helm lint helm/kamailio-db

      - name: Template chart
        run: |
          helm template kamailio-db helm/kamailio-db \
            --namespace kamailio-db

      - name: Helm install
        run: |
          helm upgrade --install kamailio-db helm/kamailio-db \
            --namespace kamailio-db \
            --create-namespace \
            --wait \
            --timeout 90s \
            --debug

      - name: Rollout status check
        run: |
          kubectl rollout status statefulset kamailio-db \
            -n kamailio-db \
            --timeout=30s

      - name: Validate PostgreSQL is working
        run: |
          POD=$(kubectl get pods -n kamailio-db -l app=kamailio-db -o jsonpath='{.items[0].metadata.name}')

          kubectl exec -n kamailio-db "$POD" -- pg_isready -U postgres
          kubectl exec -n kamailio-db "$POD" -- psql -U postgres -c "SELECT 1;"

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -n kamailio-db -o wide || true
          kubectl describe pods -n kamailio-db || true
          kubectl get events -n kamailio-db --sort-by=.metadata.creationTimestamp || true
          PODS=$(kubectl get pods -n kamailio-db -o jsonpath='{.items[*].metadata.name}' || true)

          for POD in $PODS; do
            echo "--------------------"
            echo "POD: $POD"

            echo "== CURRENT LOGS =="
            kubectl logs -n kamailio-db "$POD" --tail=200 || true

            echo "== PREVIOUS LOGS (CRASHLOOP) =="
            kubectl logs -n kamailio-db "$POD" --previous --tail=200 || true

            echo "--------------------"
          done
